extends:
  - ../../../causal_replay/tum_rgbd.yml
  - ../../../hardware/8060s/live_throughput.yml
  - ../../../rendering/live_antialiased.yml

# Matched local live-AA experiment contract. Scientific budgets, output paths,
# seeds, and baseline linkage remain owned by ResearchFlow.
streaming_input_fps_cap: 30.0
streaming_resolution: 1
# Keep the evaluation identity contract exactly matched to the classic arm.
streaming_eval_hold: 8
streaming_report_final: true
streaming_report_test_metrics_max: 1000000
streaming_optimization_constellation_policy: fixed
streaming_keyframe_max_gap_require_novelty: false
